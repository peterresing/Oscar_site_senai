<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
    <img class="imglogo" src="css/Logo_Espacial_Universal_Shop-removebg-preview.png">
    <img class="carrinho" src="css/shopping-cart.svg">
    </header>

    <main>
        <section class="hero" id="hero">
            
        <div class="card">
            <img class="imgitens" src="https://acrilicostore.fbitsstatic.net/img/p/luminaria-bola-de-cristal-3d-planeta-saturno-71466/258409-3.jpg?w=1000&h=1000&v=202507310820&qs=ignore">
            <span class="itens">Luminaria de Saturno</span>
            <span class="itens">R$50</span>
        </div>

        <div class="card">
            <img class="imgitens" src="https://acdn-us.mitiendanube.com/stores/005/618/407/products/f36050_20220926143052330194-e3edbd0b101d4be0b717529084015223-1024-1024.webp">
            <span class="itens">Kit Luneta 4 Peças</span>
            <span class="itens">R$150</span>
        </div>

        <div class="card">
            <img class="imgitens" src="https://m.media-amazon.com/images/I/51Nva6MtzkL._AC_UF894,1000_QL80_.jpg">
            <span class="itens">Estrelas Fluorescentens</span>
            <span class="itens">R$10</span>
        </div>

        <div class="card">
            <img class="imgitens" src="https://http2.mlstatic.com/D_NQ_NP_781376-MLB32328732573_092019-O-sorvete-de-astronauta--neapolitan-ice-cream-sandwich--impo.webp">
            <span class="itens">Sorvete de Astronauta</span>
            <span class="itens">R$25</span>
        </div>

        <div class="card">
            <img class="imgitens" src="https://images.tcdn.com.br/img/img_prod/460977/fantasia_capacete_de_astronauta_com_viseira_movel_estados_unidos_nasa_138913_1_8b7bd80aff4f78386dedf4d38b1179e6.jpg"> 
            <span class="itens">Capacete de Astronauta</span>
            <span class="itens">R$70</span>
        </div>

        </section>

        <section class="hero">

            <div class="card">
                <img class="imgitens" src="https://images.tcdn.com.br/img/img_prod/403641/464_1_20150626104109.jpg">
                <span class="itens">Globo Terra Giratório</span>
                <span class="itens">R$70</span>
            </div>

            <div class="card">
                <img class="imgitens" src="https://down-br.img.susercontent.com/file/br-11134207-7r98o-m7lbxuqq5gle86">
                <span class="itens">Camiseta Astronauta</span>
                <span class="itens">R$30</span>
            </div>

        </section>
    </main>

    <footer class="footer" id="footer">
        <h1>Universal Shop</h1>
        <p>Itens da Galaxia Diretamente para sua Casa</p>
        <div class="criadores">
            <h2><img class="imgcriadores" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGo6JE6juXUcVg4sykwsYysO6IO4SNUc0PHCNl9aKz5iuoC1hpkl0HyuUY&s=10"><a href="">Peter Silva Resing</a></h2>
            
            <h2><img class="imgcriadores" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQeb-n2BpwOdTxtyOJBkH_ZAW_hz4kRXiuWrLlcGyVoGw&s=10"><a href="">Rodrigo Fontoura</a></h2>
        </div>
    </footer>


</body>
</html>
