<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Universal Shop — produtos incríveis para quem ama o espaço.">
  <title>Universal Shop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="Universal Shop - início"><img src="css/logo-universal-shop.png" alt="Universal Shop"></a>
    <nav class="nav-links" aria-label="Criadores do site">

      <a class="creator-link" href="https://github.com/RodrigoSmi" aria-label="Perfil GitHub de Rodrigo" title="Rodrigo" target="_blank">
        <img class="creator-avatar" src="https://avatars.githubusercontent.com/u/298895550?v=4" alt="">
        <span>Rodrigo</span>
      </a>

      <a class="creator-link" href="https://github.com/peterresing" aria-label="Perfil GitHub de Piter" title="Piter" target="_blank">
        <img class="creator-avatar" src="https://avatars.githubusercontent.com/u/298891883?v=4" alt="">
        <span>Peter</span>
      </a>
    </nav>
    <button class="cart-button" id="open-cart" aria-label="Abrir carrinho"><img class="carrinho" src="css/carrinho-de-compras.png"><span>Carrinho</span><b id="cart-count">0</b></button>
  </header>
  <main id="inicio">
    <section class="catalog" id="produtos">
      <div class="section-heading"><div><h2>Produtos</h2></div></div>
      <div class="product-grid" id="product-grid"></div>
    </section>
    <section class="finalizar-page" id="finalizar-view" hidden>
      <button class="back-link" id="back-to-store" type="button"><img class="voltar" src="css/seta-para-a-esquerda.png">Continuar comprando</button>
      <h1>Finalizar pedido</h1>
      <p class="finalizar-intro">Confira seus produtos</p>
      <div class="finalizar-layout">
        <section class="finalizar-panel">
          <h2>Carrinho</h2>
          <div id="finalizar-items"><p class="empty-finalizar">Seu carrinho está vazio.</p></div>
        </section>
        <section class="finalizar-panel">
          <h2>Total da compra</h2>
          <div class="finalizar-total"><span>Total</span><strong id="finalizar-total">R$ 0,00</strong></div>
          <button class="confirm-button" id="confirm-order" type="button">Confirmar pedido</button>
          <div class="finalizar-message" id="finalizar-message" role="status"></div>
        </section>
      </div>
    </section>
  </main>
  <div class="overlay" id="overlay"></div>
  <aside class="cart-drawer" id="cart-drawer" aria-label="Carrinho de compras" aria-hidden="true"><div class="cart-head"><div><span class="eyebrow">SUA COMPRA</span><h2>Meu carrinho</h2></div><button id="close-cart" class="close-button" aria-label="Fechar carrinho">×</button></div><div id="cart-items" class="cart-items"><p class="empty-cart">Seu carrinho está vazio.</p></div><div class="cart-bottom"><div class="total-row"><span>Total</span><strong id="cart-total">R$ 0,00</strong></div><button class="finalizar-button" id="finalizar">Finalizar pedido</button></div></aside>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/script.js"></script>
</body>
</html>
